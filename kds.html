<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDS de Producao La Qualite Delivery</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="screen kds-screen">
      <header class="topbar">
        <div>
          <p class="eyebrow">La Qualite Delivery</p>
          <h1>KDS Producao</h1>
        </div>

        <div class="kds-actions">
          <div class="kds-size-control" aria-label="Tamanho dos cards">
            <button class="kds-size-button" type="button" data-size="compact">Menor</button>
            <button class="kds-size-button active" type="button" data-size="normal">Normal</button>
            <button class="kds-size-button" type="button" data-size="large">Maior</button>
          </div>
          <a class="panel-link" href="/">Expedicao</a>
        </div>
      </header>

      <section class="summary" aria-label="Resumo da producao">
        <div class="summary-item">
          <span>Pedidos em aberto</span>
          <strong id="kds-order-count">0</strong>
        </div>
        <div class="summary-item">
          <span>Atualizado</span>
          <strong id="kds-updated-at">--:--</strong>
        </div>
      </section>

      <section class="kds-grid" id="kds-grid" aria-label="Produtos em producao"></section>
    </main>

    <script src="./kds.js"></script>
  </body>
</html>
